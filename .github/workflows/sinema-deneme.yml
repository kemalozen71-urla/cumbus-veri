name: Sinema deneme
on:
  push:
    branches: [main]
    paths: [toplayici/sinema_deneme.py, .github/workflows/sinema-deneme.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python toplayici/sinema_deneme.py
      - run: |
          git config user.name "cumbus-bot"; git config user.email "bot@cumbus.local"
          git add deneme && git commit -m "Sinema deneme çıktısı" || true
          git pull --rebase && git push
